<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Numéros doublons</title>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

<style>
body {
  font-family: Arial, sans-serif;
  background: #f4f4f4;
  margin: 0;
  padding: 20px;
  color: #222;
}

h1 {
  text-align: center;
  font-size: 24px;
}

.box {
  background: white;
  padding: 18px;
  border-radius: 14px;
  margin-bottom: 15px;
  box-shadow: 0 2px 8px rgba(0,0,0,.08);
}

.button,
button {
  display: block;
  width: 100%;
  box-sizing: border-box;
  padding: 14px;
  margin-top: 10px;
  border: none;
  border-radius: 10px;
  background: #007aff;
  color: white;
  font-size: 17px;
  text-align: center;
}

input[type="file"] {
  display: none;
}

#status {
  text-align: center;
  font-weight: bold;
  margin-top: 15px;
}

progress {
  width: 100%;
  height: 20px;
  margin-top: 10px;
}

.result {
  background: #f0f0f0;
  padding: 12px;
  margin-top: 10px;
  border-radius: 8px;
}

.number {
  font-family: monospace;
  font-size: 17px;
  margin: 5px 0;
}

.duplicate {
  color: #c00;
  font-weight: bold;
}

.warning {
  background: #fff3cd;
  color: #856404;
  padding: 10px;
  margin-top: 8px;
  border-radius: 8px;
  font-size: 14px;
}
</style>
</head>

<body>

<h1>📱 Vérification des numéros</h1>

<div class="box">

<label class="button" for="libraryInput">
📷 Choisir des photos
</label>

<input
  id="libraryInput"
  type="file"
  accept="image/*"
  multiple
>

<label class="button" for="cameraInput">
📸 Prendre une photo
</label>

<input
  id="cameraInput"
  type="file"
  accept="image/*"
  capture="environment"
>

<button id="processButton">
🔍 Vérifier les numéros
</button>

<div id="status"></div>

<progress id="progress" value="0" max="100" hidden></progress>

</div>

<div class="box" id="results" hidden>

<div class="result">
<strong>Total reconnu :</strong>
<span id="total">0</span>
</div>

<div class="result">
<strong>Numéros différents :</strong>
<span id="unique">0</span>
</div>

<div class="result">
<strong>Doublons :</strong>
<span id="duplicateCount">0</span>
</div>

<div class="result">
<strong>Doublons trouvés :</strong>
<div id="duplicates"></div>
</div>

<div id="warnings"></div>

</div>


<script>

const libraryInput =
document.getElementById("libraryInput");

const cameraInput =
document.getElementById("cameraInput");

const processButton =
document.getElementById("processButton");

const status =
document.getElementById("status");

const progress =
document.getElementById("progress");

const results =
document.getElementById("results");

const totalElement =
document.getElementById("total");

const uniqueElement =
document.getElementById("unique");

const duplicateCountElement =
document.getElementById("duplicateCount");

const duplicatesElement =
document.getElementById("duplicates");

const warningsElement =
document.getElementById("warnings");

let selectedFiles = [];


/* ==========================================
   SÉLECTION DES PHOTOS
========================================== */

libraryInput.addEventListener("change", function() {

  selectedFiles = Array.from(this.files);

  status.textContent =
    selectedFiles.length +
    " photo(s) sélectionnée(s).";

});


cameraInput.addEventListener("change", function() {

  selectedFiles = Array.from(this.files);

  status.textContent =
    selectedFiles.length +
    " photo(s) sélectionnée(s).";

});


/* ==========================================
   CHARGER IMAGE
========================================== */

function loadImage(file) {

  return new Promise((resolve, reject) => {

    const img = new Image();

    img.onload = () => resolve(img);

    img.onerror = reject;

    img.src = URL.createObjectURL(file);

  });

}


/* ==========================================
   PRÉPARER L'IMAGE
========================================== */

function prepareImage(img) {

  const scale = 3;

  const canvas =
    document.createElement("canvas");

  canvas.width =
    img.width * scale;

  canvas.height =
    img.height * scale;

  const ctx =
    canvas.getContext("2d");

  ctx.drawImage(
    img,
    0,
    0,
    canvas.width,
    canvas.height
  );

  return canvas;
}


/* ==========================================
   AMÉLIORER UNE BANDE
========================================== */

function prepareBand(source, y, height) {

  /*
    On prend seulement la partie gauche
    de la page.

    La partie droite contient :
    ~604XXXXXXXXXXXXX

    Elle n'est donc jamais analysée.
  */

  const leftPart =
    Math.floor(source.width * 0.52);

  const canvas =
    document.createElement("canvas");

  /*
    Agrandissement supplémentaire
  */

  const scale = 2;

  canvas.width =
    leftPart * scale;

  canvas.height =
    height * scale;

  const ctx =
    canvas.getContext("2d");

  ctx.drawImage(
    source,
    0,
    y,
    leftPart,
    height,
    0,
    0,
    canvas.width,
    canvas.height
  );


  /*
    Noir et blanc + contraste
  */

  const imageData =
    ctx.getImageData(
      0,
      0,
      canvas.width,
      canvas.height
    );

  const data =
    imageData.data;

  for (
    let i = 0;
    i < data.length;
    i += 4
  ) {

    const r = data[i];
    const g = data[i + 1];
    const b = data[i + 2];

    const gray =
      0.299 * r +
      0.587 * g +
      0.114 * b;

    /*
      Seuil assez souple.
    */

    const value =
      gray > 145 ? 255 : 0;

    data[i] = value;
    data[i + 1] = value;
    data[i + 2] = value;

  }

  ctx.putImageData(
    imageData,
    0,
    0
  );

  return canvas;
}


/* ==========================================
   EXTRAIRE LE NUMÉRO
========================================== */

function extractNumber(text) {

  if (!text) {
    return null;
  }

  /*
    On ne garde que les chiffres.
  */

  let digits =
    text.replace(/\D/g, "");

  /*
    Recherche directe :
    212 + 9 chiffres
  */

  const match =
    digits.match(/212\d{9}/);

  if (match) {
    return match[0];
  }

  /*
    Si Tesseract ajoute quelques chiffres
    avant le numéro, on cherche 212
    n'importe où.
  */

  const position =
    digits.indexOf("212");

  if (position >= 0) {

    const candidate =
      digits.substring(
        position,
        position + 12
      );

    if (
      /^212\d{9}$/.test(candidate)
    ) {

      return candidate;

    }

  }

  return null;
}


/* ==========================================
   DÉTECTER LES LIGNES
========================================== */

async function detectLines(worker, canvas) {

  /*
    On utilise une reconnaissance globale
    uniquement pour connaître les positions
    verticales des lignes.

    Les chiffres eux-mêmes ne sont PAS
    récupérés avec cette reconnaissance.
  */

  const result =
    await worker.recognize(canvas);

  if (
    result.data &&
    result.data.lines &&
    result.data.lines.length
  ) {

    return result.data.lines
      .map(line => ({
        y0: line.bbox.y0,
        y1: line.bbox.y1
      }))
      .sort((a,b) => a.y0 - b.y0);

  }

  return [];

}


/* ==========================================
   LECTURE D'UNE BANDE
========================================== */

async function readBand(worker, band) {

  const result =
    await worker.recognize(band);

  return result.data.text || "";

}


/* ==========================================
   TRAITER UNE PHOTO
========================================== */

async function processPhoto(
  worker,
  file,
  photoIndex,
  totalPhotos
) {

  const img =
    await loadImage(file);

  const canvas =
    prepareImage(img);


  /*
    Trouver les positions des lignes.
  */

  const lines =
    await detectLines(
      worker,
      canvas
    );


  const numbers = [];
  const warnings = [];


  if (!lines.length) {

    return {
      numbers,
      warnings: [{
        photo: photoIndex,
        line: 0,
        text: "Impossible de détecter les lignes."
      }]
    };

  }


  /*
    Chaque ligne est maintenant lue
    séparément.
  */

  for (
    let i = 0;
    i < lines.length;
    i++
  ) {

    const line =
      lines[i];


    /*
      On ajoute une petite marge verticale
      autour des chiffres.
    */

    const margin = 8;

    const y =
      Math.max(
        0,
        line.y0 - margin
      );

    const bottom =
      Math.min(
        canvas.height,
        line.y1 + margin
      );

    const height =
      bottom - y;


    if (height <= 0) {
      continue;
    }


    /*
      Préparer uniquement la colonne
      212XXXXXXXXX
    */

    const band =
      prepareBand(
        canvas,
        y,
        height
      );


    /*
      OCR uniquement chiffres.
    */

    const text =
      await readBand(
        worker,
        band
      );


    const number =
      extractNumber(text);


    if (number) {

      numbers.push(number);

    } else {

      /*
        Seulement une véritable anomalie
        est affichée.
      */

      const digits =
        text.replace(/\D/g, "");

      if (digits.length > 4) {

        warnings.push({
          photo: photoIndex,
          line: i + 1,
          text: text
        });

      }

    }


    const progressValue =
      (
        (photoIndex - 1) /
        totalPhotos
      ) * 100
      +
      (
        (i + 1) /
        lines.length
      ) *
      (
        100 /
        totalPhotos
      );

    progress.value =
      Math.round(progressValue);

  }


  return {
    numbers,
    warnings
  };

}


/* ==========================================
   TRAITEMENT PRINCIPAL
========================================== */

processButton.addEventListener(
  "click",
  async function() {

    if (!selectedFiles.length) {

      alert(
        "Choisissez d'abord une ou plusieurs photos."
      );

      return;
    }


    processButton.disabled = true;

    results.hidden = true;

    warningsElement.innerHTML = "";

    duplicatesElement.innerHTML = "";

    progress.hidden = false;

    progress.value = 0;


    const allNumbers = [];
    const allWarnings = [];


    try {

      status.textContent =
        "Préparation de l'OCR...";


      const worker =
        await Tesseract.createWorker(
          "eng",
          1,
          {
            logger: message => {

              if (
                message.status ===
                "recognizing text"
              ) {

                const p =
                  Math.round(
                    (message.progress || 0) *
                    100
                  );

                status.textContent =
                  "Lecture : " +
                  p +
                  "%";

              }

            }
          }
        );


      /*
        On demande à Tesseract de privilégier
        les chiffres.
      */

      await worker.setParameters({

        tessedit_char_whitelist:
          "0123456789",

        preserve_interword_spaces:
          "0"

      });


      /*
        Traiter chaque photo.
      */

      for (
        let i = 0;
        i < selectedFiles.length;
        i++
      ) {

        status.textContent =
          "Photo " +
          (i + 1) +
          " / " +
          selectedFiles.length;


        const result =
          await processPhoto(
            worker,
            selectedFiles[i],
            i + 1,
            selectedFiles.length
          );


        allNumbers.push(
          ...result.numbers
        );


        allWarnings.push(
          ...result.warnings
        );

      }


      await worker.terminate();


      /* ==================================
         COMPTAGE
      ================================== */

      const counts =
        new Map();


      allNumbers.forEach(number => {

        counts.set(
          number,
          (counts.get(number) || 0) + 1
        );

      });


      const duplicates = [];


      counts.forEach(
        (count, number) => {

          if (count > 1) {

            duplicates.push({
              number,
              count
            });

          }

        }
      );


      /* ==================================
         AFFICHAGE
      ================================== */

      totalElement.textContent =
        allNumbers.length;

      uniqueElement.textContent =
        counts.size;

      duplicateCountElement.textContent =
        duplicates.length;


      if (!duplicates.length) {

        duplicatesElement.innerHTML =
          "✅ Aucun doublon trouvé.";

      } else {

        duplicates
          .sort(
            (a,b) =>
              b.count - a.count
          )
          .forEach(item => {

            const div =
              document.createElement("div");

            div.className =
              "number duplicate";

            div.textContent =
              item.number +
              " → " +
              item.count +
              " fois";

            duplicatesElement.appendChild(
              div
            );

          });

      }


      /* ==================================
         AVERTISSEMENTS
      ================================== */

      if (allWarnings.length) {

        const title =
          document.createElement("div");

        title.className =
          "warning";

        title.innerHTML =
          "<strong>⚠️ Numéros non reconnus :</strong><br>" +
          allWarnings.length +
          " ligne(s).";

        warningsElement.appendChild(
          title
        );


        allWarnings.forEach(item => {

          const div =
            document.createElement("div");

          div.className =
            "warning";

          div.innerHTML =
            "Photo " +
            item.photo +
            " — ligne " +
            item.line +
            "<br>Lecture OCR : " +
            (
              item.text ||
              "(aucun chiffre)"
            );

          warningsElement.appendChild(
            div
          );

        });

      }


      results.hidden = false;

      progress.value = 100;

      status.textContent =
        "✅ Vérification terminée.";


    } catch (error) {

      console.error(error);

      status.textContent =
        "❌ Erreur pendant la reconnaissance.";

      alert(
        "Une erreur est survenue pendant la lecture."
      );

    }


    processButton.disabled = false;

  });

</script>

</body>
</html>
