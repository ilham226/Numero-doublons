<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Numéros doublons</title>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

<style>
body {
    font-family: Arial, sans-serif;
    margin: 0;
    padding: 20px;
    background: #f5f5f5;
    color: #222;
}

.container {
    max-width: 700px;
    margin: auto;
}

h1 {
    text-align: center;
}

.card {
    background: white;
    padding: 15px;
    border-radius: 12px;
    margin-top: 15px;
}

button {
    width: 100%;
    padding: 15px;
    border: 0;
    border-radius: 10px;
    background: #007aff;
    color: white;
    font-size: 17px;
    font-weight: bold;
    margin: 6px 0;
}

button:disabled {
    background: #aaa;
}

input[type="file"] {
    display: none;
}

.fileButton {
    display: block;
    width: 100%;
    box-sizing: border-box;
    padding: 15px;
    border-radius: 10px;
    background: #34a853;
    color: white;
    text-align: center;
    font-size: 17px;
    font-weight: bold;
    margin: 6px 0;
    cursor: pointer;
}

.cameraButton {
    background: #ff9500;
}

.number {
    font-family: monospace;
    font-size: 17px;
    padding: 6px 0;
}

.duplicate {
    color: #d00000;
    font-weight: bold;
}

.warning {
    color: #a05a00;
    padding: 5px 0;
}

#progress {
    margin-top: 15px;
    text-align: center;
    font-weight: bold;
}

#selectedPhotos {
    margin-top: 10px;
    font-size: 14px;
}
</style>
</head>

<body>

<div class="container">

<h1>📱 Numéros doublons</h1>

<div class="card">

    <h3>1️⃣ Ajouter les photos</h3>

    <!-- Bibliothèque -->
    <label class="fileButton">
        🖼️ Choisir dans la bibliothèque
        <input
            id="libraryInput"
            type="file"
            accept="image/*"
            multiple
        >
    </label>

    <!-- Appareil photo -->
    <label class="fileButton cameraButton">
        📷 Prendre une photo
        <input
            id="cameraInput"
            type="file"
            accept="image/*"
            capture="environment"
        >
    </label>

    <div id="selectedPhotos">
        Aucune photo sélectionnée.
    </div>

    <button id="start">
        🔍 Lire les numéros
    </button>

    <div id="progress"></div>

</div>

<div id="summary"></div>

<div id="duplicates"></div>

<div id="verify"></div>

</div>


<script>

const libraryInput =
    document.getElementById("libraryInput");

const cameraInput =
    document.getElementById("cameraInput");

const startButton =
    document.getElementById("start");

const progress =
    document.getElementById("progress");

const selectedPhotos =
    document.getElementById("selectedPhotos");


// Toutes les photos ajoutées
let selectedFiles = [];


// ---------------------------------------------------------
// Bibliothèque
// ---------------------------------------------------------

libraryInput.addEventListener("change", function() {

    const files = Array.from(this.files);

    selectedFiles.push(...files);

    updatePhotoList();

    // Permet de sélectionner à nouveau les mêmes photos
    this.value = "";
});


// ---------------------------------------------------------
// Appareil photo
// ---------------------------------------------------------

cameraInput.addEventListener("change", function() {

    const files = Array.from(this.files);

    selectedFiles.push(...files);

    updatePhotoList();

    this.value = "";
});


// ---------------------------------------------------------
// Affichage des photos sélectionnées
// ---------------------------------------------------------

function updatePhotoList() {

    if (selectedFiles.length === 0) {

        selectedPhotos.textContent =
            "Aucune photo sélectionnée.";

        return;
    }

    selectedPhotos.innerHTML =
        `📸 ${selectedFiles.length} photo(s) sélectionnée(s).`;
}


// ---------------------------------------------------------
// Chargement image
// ---------------------------------------------------------

function loadImage(file) {

    return new Promise((resolve, reject) => {

        const img = new Image();

        img.onload = () => resolve(img);

        img.onerror = reject;

        img.src = URL.createObjectURL(file);
    });
}


// ---------------------------------------------------------
// Préparation image
// ---------------------------------------------------------

function preprocessImage(img) {

    const canvas =
        document.createElement("canvas");

    const maxWidth = 2500;

    let width = img.naturalWidth;
    let height = img.naturalHeight;

    if (width > maxWidth) {

        const ratio =
            maxWidth / width;

        width = maxWidth;

        height =
            Math.round(height * ratio);
    }

    canvas.width = width;
    canvas.height = height;

    const ctx =
        canvas.getContext("2d");

    ctx.drawImage(
        img,
        0,
        0,
        width,
        height
    );

    const imageData =
        ctx.getImageData(
            0,
            0,
            width,
            height
        );

    const data =
        imageData.data;

    for (
        let i = 0;
        i < data.length;
        i += 4
    ) {

        let r = data[i];
        let g = data[i + 1];
        let b = data[i + 2];

        let gray =
            0.299 * r +
            0.587 * g +
            0.114 * b;

        gray =
            (gray - 128) * 1.5 + 128;

        gray =
            Math.max(
                0,
                Math.min(255, gray)
            );

        data[i] = gray;
        data[i + 1] = gray;
        data[i + 2] = gray;
    }

    ctx.putImageData(
        imageData,
        0,
        0
    );

    return canvas;
}


// ---------------------------------------------------------
// Recherche numéro 212xxxxxxxxx
// ---------------------------------------------------------

function extractPhone(text) {

    if (!text) return null;

    let s = text
        .replace(/\s/g, "")
        .replace(/[|Il]/g, "1")
        .replace(/[OoQ]/g, "0");

    const matches =
        s.match(/212\d{9}/g);

    if (
        matches &&
        matches.length > 0
    ) {

        return matches[0];
    }

    return null;
}


// ---------------------------------------------------------
// Détection des lignes
// ---------------------------------------------------------

async function detectLines(
    worker,
    canvas
) {

    const result =
        await worker.recognize(canvas);

    return result.data.lines || [];
}


// ---------------------------------------------------------
// Lecture d'une ligne
// ---------------------------------------------------------

async function readLine(
    worker,
    canvas,
    line
) {

    const x =
        Math.max(
            0,
            Math.floor(line.bbox.x0)
        );

    const y =
        Math.max(
            0,
            Math.floor(line.bbox.y0)
        );

    const width =
        Math.min(
            canvas.width - x,
            Math.ceil(
                line.bbox.x1 -
                line.bbox.x0
            )
        );

    const height =
        Math.min(
            canvas.height - y,
            Math.ceil(
                line.bbox.y1 -
                line.bbox.y0
            )
        );

    if (
        width <= 0 ||
        height <= 0
    ) {

        return null;
    }


    // Première colonne uniquement
    const cropWidth =
        Math.min(
            width,
            Math.floor(
                canvas.width * 0.55
            )
        );


    const crop =
        document.createElement("canvas");

    crop.width = cropWidth;
    crop.height = height;

    const ctx =
        crop.getContext("2d");

    ctx.drawImage(
        canvas,
        x,
        y,
        cropWidth,
        height,
        0,
        0,
        cropWidth,
        height
    );


    const result =
        await worker.recognize(crop);

    return result.data.text || "";
}


// ---------------------------------------------------------
// Analyse
// ---------------------------------------------------------

startButton.addEventListener(
    "click",
    async function() {

        if (
            selectedFiles.length === 0
        ) {

            alert(
                "Ajoute au moins une photo."
            );

            return;
        }


        startButton.disabled = true;


        let allNumbers = [];
        let allWarnings = [];

        let totalLines = 0;


        progress.textContent =
            "⏳ Préparation de l'OCR...";


        const worker =
            await Tesseract.createWorker(
                "eng"
            );


        await worker.setParameters({

            tessedit_char_whitelist:
                "0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz-|"
        });


        try {

            for (
                let photoIndex = 0;
                photoIndex < selectedFiles.length;
                photoIndex++
            ) {

                const file =
                    selectedFiles[photoIndex];


                progress.textContent =
                    `📷 Photo ${
                        photoIndex + 1
                    }/${
                        selectedFiles.length
                    } : préparation...`;


                const img =
                    await loadImage(file);


                const canvas =
                    preprocessImage(img);


                progress.textContent =
                    `🔎 Photo ${
                        photoIndex + 1
                    }/${
                        selectedFiles.length
                    } : recherche des lignes...`;


                const lines =
                    await detectLines(
                        worker,
                        canvas
                    );


                totalLines +=
                    lines.length;


                if (
                    lines.length === 0
                ) {

                    allWarnings.push(
                        `Photo ${
                            photoIndex + 1
                        } : aucune ligne détectée`
                    );

                    continue;
                }


                for (
                    let i = 0;
                    i < lines.length;
                    i++
                ) {

                    progress.textContent =
                        `📖 Photo ${
                            photoIndex + 1
                        }/${
                            selectedFiles.length
                        } — ligne ${
                            i + 1
                        }/${
                            lines.length
                        }`;


                    const text =
                        await readLine(
                            worker,
                            canvas,
                            lines[i]
                        );


                    const phone =
                        extractPhone(text);


                    if (phone) {

                        allNumbers.push({

                            number: phone,

                            photo:
                                photoIndex + 1,

                            line:
                                i + 1
                        });

                    } else {

                        allWarnings.push({

                            photo:
                                photoIndex + 1,

                            line:
                                i + 1,

                            text:
                                text ||
                                "(aucun texte reconnu)"
                        });
                    }
                }
            }

        } catch (error) {

            console.error(error);

            alert(
                "Une erreur est survenue pendant la lecture."
            );

        } finally {

            await worker.terminate();

            progress.textContent =
                "✅ Analyse terminée.";

            displayResults(
                totalLines,
                allNumbers,
                allWarnings
            );

            startButton.disabled = false;
        }
    }
);


// ---------------------------------------------------------
// Résultats
// ---------------------------------------------------------

function displayResults(
    totalLines,
    allNumbers,
    allWarnings
) {

    const summary =
        document.getElementById(
            "summary"
        );

    const duplicatesDiv =
        document.getElementById(
            "duplicates"
        );

    const verifyDiv =
        document.getElementById(
            "verify"
        );


    const counts = {};


    allNumbers.forEach(item => {

        if (!counts[item.number]) {

            counts[item.number] = [];
        }

        counts[item.number].push(item);
    });


    const duplicates =
        Object.entries(counts)
        .filter(
            ([number, items]) =>
                items.length > 1
        );


    summary.innerHTML = `

        <div class="card">

            <h2>📊 Résultat</h2>

            <p>
                <b>Photos :</b>
                ${selectedFiles.length}
            </p>

            <p>
                <b>Lignes détectées :</b>
                ${totalLines}
            </p>

            <p>
                <b>Numéros reconnus :</b>
                ${allNumbers.length}
            </p>

            <p>
                <b>À vérifier :</b>
                ${allWarnings.length}
            </p>

            <p>
                <b>Numéros différents :</b>
                ${Object.keys(counts).length}
            </p>

            <p>
                <b>Numéros en double :</b>
                ${duplicates.length}
            </p>

        </div>
    `;


    // Doublons

    if (
        duplicates.length > 0
    ) {

        let html = `

            <div class="card">

                <h2>
                    🔴 Numéros qui se répètent
                </h2>
        `;


        duplicates.forEach(
            ([number, items]) => {

                html += `

                    <div class="number duplicate">

                        ${number}

                        — ${items.length} fois

                    </div>
                `;
            }
        );


        html += `

                <button
                    onclick="copyDuplicates()"
                >
                    📋 Copier les doublons
                </button>

            </div>
        `;


        duplicatesDiv.innerHTML =
            html;

    } else {

        duplicatesDiv.innerHTML = `

            <div class="card">

                <h2>
                    🟢 Aucun doublon
                </h2>

            </div>
        `;
    }


    // À vérifier

    if (
        allWarnings.length > 0
    ) {

        let html = `

            <div class="card">

                <h2>
                    ⚠️ À vérifier
                </h2>

                <p>
                    Certaines lignes n'ont pas
                    permis de reconnaître clairement
                    un numéro 212...
                </p>
        `;


        allWarnings.forEach(item => {

            if (
                typeof item === "string"
            ) {

                html += `

                    <div class="warning">
                        ${item}
                    </div>
                `;

            } else {

                html += `

                    <div class="warning">

                        Photo ${item.photo},
                        ligne ${item.line}

                        — OCR :

                        <b>
                            ${escapeHtml(item.text)}
                        </b>

                    </div>
                `;
            }
        });


        html += `
            </div>
        `;


        verifyDiv.innerHTML =
            html;

    } else {

        verifyDiv.innerHTML = `

            <div class="card">

                <h2>
                    ✅ Toutes les lignes ont été reconnues
                </h2>

            </div>
        `;
    }
}


// ---------------------------------------------------------
// Copier les doublons
// ---------------------------------------------------------

function copyDuplicates() {

    const counts = {};


    // Il faudrait récupérer les numéros
    // depuis le résultat affiché.
    const elements =
        document.querySelectorAll(
            ".duplicate"
        );


    const numbers = [];


    elements.forEach(element => {

        const text =
            element.textContent.trim();

        const match =
            text.match(
                /212\d{9}/
            );

        if (match) {

            numbers.push(
                match[0]
            );
        }
    });


    navigator.clipboard.writeText(
        numbers.join("\n")
    );


    alert(
        `${numbers.length} doublon(s) copié(s).`
    );
}


// ---------------------------------------------------------
// Sécurité
// ---------------------------------------------------------

function escapeHtml(text) {

    return String(text)
        .replace(
            /&/g,
            "&amp;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        )
        .replace(
            /"/g,
            "&quot;"
        )
        .replace(
            /'/g,
            "&#039;"
        );
}

</script>

</body>
</html>
