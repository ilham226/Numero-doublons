<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Vérification des numéros</title>

  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 20px;
      background: #f5f5f5;
      color: #222;
    }

    h1 {
      text-align: center;
      font-size: 24px;
    }

    .box {
      background: white;
      padding: 18px;
      border-radius: 14px;
      margin-bottom: 15px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    button,
    label.button {
      display: block;
      width: 100%;
      box-sizing: border-box;
      padding: 14px;
      margin-top: 10px;
      border: 0;
      border-radius: 10px;
      background: #007aff;
      color: white;
      font-size: 17px;
      text-align: center;
      cursor: pointer;
    }

    input[type="file"] {
      display: none;
    }

    #status {
      margin-top: 15px;
      font-weight: bold;
      text-align: center;
    }

    .result {
      margin-top: 10px;
      padding: 12px;
      border-radius: 8px;
      background: #f0f0f0;
    }

    .duplicate {
      color: #c00;
      font-weight: bold;
    }

    .warning {
      background: #fff3cd;
      color: #856404;
      margin-top: 8px;
      padding: 10px;
      border-radius: 8px;
      font-size: 14px;
    }

    .number {
      font-family: monospace;
      font-size: 17px;
      margin: 4px 0;
    }

    .small {
      font-size: 13px;
      color: #666;
    }

    progress {
      width: 100%;
      height: 20px;
      margin-top: 10px;
    }
  </style>
</head>

<body>

  <h1>📱 Vérification des numéros</h1>

  <div class="box">

    <label class="button" for="libraryInput">
      📷 Choisir des photos
    </label>

    <input
      id="libraryInput"
      type="file"
      accept="image/*"
      multiple
    >

    <label class="button" for="cameraInput">
      📸 Prendre une photo
    </label>

    <input
      id="cameraInput"
      type="file"
      accept="image/*"
      capture="environment"
    >

    <button id="processButton">
      🔍 Vérifier les numéros
    </button>

    <div id="status"></div>

    <progress id="progress" value="0" max="100" hidden></progress>

  </div>

  <div class="box" id="results" hidden>

    <div class="result">
      <strong>Total reconnu :</strong>
      <span id="total">0</span>
    </div>

    <div class="result">
      <strong>Numéros différents :</strong>
      <span id="unique">0</span>
    </div>

    <div class="result">
      <strong>Doublons :</strong>
      <span id="duplicateCount">0</span>
    </div>

    <div class="result">
      <strong>Liste des doublons :</strong>
      <div id="duplicates"></div>
    </div>

    <div id="warnings"></div>

  </div>


<script>

const libraryInput = document.getElementById("libraryInput");
const cameraInput = document.getElementById("cameraInput");
const processButton = document.getElementById("processButton");

const status = document.getElementById("status");
const progress = document.getElementById("progress");

const results = document.getElementById("results");
const totalElement = document.getElementById("total");
const uniqueElement = document.getElementById("unique");
const duplicateCountElement = document.getElementById("duplicateCount");
const duplicatesElement = document.getElementById("duplicates");
const warningsElement = document.getElementById("warnings");


let selectedFiles = [];


/* --------------------------------------------------
   Sélection des photos
-------------------------------------------------- */

libraryInput.addEventListener("change", function() {

  selectedFiles = Array.from(this.files);

  status.textContent =
    selectedFiles.length +
    " photo(s) sélectionnée(s).";

});


cameraInput.addEventListener("change", function() {

  selectedFiles = Array.from(this.files);

  status.textContent =
    selectedFiles.length +
    " photo(s) sélectionnée(s).";

});


/* --------------------------------------------------
   Charger une image
-------------------------------------------------- */

function loadImage(file) {

  return new Promise((resolve, reject) => {

    const image = new Image();

    image.onload = () => resolve(image);

    image.onerror = reject;

    image.src = URL.createObjectURL(file);

  });

}


/* --------------------------------------------------
   Préparation d'une image
-------------------------------------------------- */

function prepareCanvas(image) {

  const scale = 3;

  const canvas = document.createElement("canvas");

  canvas.width = image.width * scale;
  canvas.height = image.height * scale;

  const ctx = canvas.getContext("2d");

  ctx.drawImage(
    image,
    0,
    0,
    canvas.width,
    canvas.height
  );

  const imageData =
    ctx.getImageData(
      0,
      0,
      canvas.width,
      canvas.height
    );

  const data = imageData.data;

  for (let i = 0; i < data.length; i += 4) {

    const r = data[i];
    const g = data[i + 1];
    const b = data[i + 2];

    const gray =
      0.299 * r +
      0.587 * g +
      0.114 * b;

    const value = gray > 160 ? 255 : 0;

    data[i] = value;
    data[i + 1] = value;
    data[i + 2] = value;

  }

  ctx.putImageData(imageData, 0, 0);

  return canvas;
}


/* --------------------------------------------------
   Extraire une zone
-------------------------------------------------- */

function cropCanvas(
  source,
  x,
  y,
  width,
  height
) {

  const canvas = document.createElement("canvas");

  canvas.width = width;
  canvas.height = height;

  const ctx = canvas.getContext("2d");

  ctx.drawImage(
    source,
    x,
    y,
    width,
    height,
    0,
    0,
    width,
    height
  );

  return canvas;
}


/* --------------------------------------------------
   Nettoyer le résultat OCR
-------------------------------------------------- */

function cleanOCR(text) {

  return text
    .replace(/\s/g, "")
    .replace(/O/gi, "0")
    .replace(/[Il|]/g, "1")
    .replace(/S/g, "5")
    .replace(/B/g, "8")
    .replace(/Z/g, "2");

}


/* --------------------------------------------------
   Chercher un numéro 212XXXXXXXXX
-------------------------------------------------- */

function findPhoneNumber(text) {

  const cleaned = cleanOCR(text);

  /*
     Cas idéal :
     212 + 9 chiffres
  */

  let match = cleaned.match(/212\d{9}/);

  if (match) {
    return match[0];
  }

  /*
     Certains OCR peuvent mettre des caractères
     parasites entre les chiffres.
  */

  const digits = cleaned.replace(/\D/g, "");

  match = digits.match(/212\d{9}/);

  if (match) {
    return match[0];
  }

  /*
     Dernier cas :
     si le texte commence par 212 et contient
     suffisamment de chiffres.
  */

  if (
    digits.length >= 12 &&
    digits.substring(0, 3) === "212"
  ) {

    return digits.substring(0, 12);

  }

  return null;
}


/* --------------------------------------------------
   OCR d'une ligne
-------------------------------------------------- */

async function readLine(worker, canvas) {

  const result = await worker.recognize(canvas);

  return result.data.text || "";

}


/* --------------------------------------------------
   Traiter une photo
-------------------------------------------------- */

async function processPhoto(
  worker,
  file,
  photoNumber,
  totalPhotos
) {

  const image = await loadImage(file);

  /*
     Image préparée en grand format
  */

  const canvas = prepareCanvas(image);

  /*
     OCR global uniquement pour trouver
     les différentes lignes.
  */

  const result = await worker.recognize(canvas);

  let lines = [];

  if (
    result.data &&
    result.data.lines &&
    result.data.lines.length
  ) {

    lines = result.data.lines;

  }


  /*
     Si Tesseract ne trouve pas les lignes,
     on utilise une méthode de secours.
  */

  if (!lines.length) {

    const textLines =
      (result.data.text || "")
        .split("\n")
        .map(x => x.trim())
        .filter(Boolean);

    return {
      numbers: [],
      warnings: textLines.map((text, index) => ({
        line: index + 1,
        text: text
      }))
    };

  }


  const numbers = [];
  const warnings = [];

  /*
     Les lignes sont traitées de haut en bas.
  */

  lines.sort((a, b) => {

    return a.bbox.y0 - b.bbox.y0;

  });


  for (let i = 0; i < lines.length; i++) {

    const line = lines[i];

    /*
       Coordonnées de la ligne.
    */

    const x = Math.max(0, line.bbox.x0);
    const y = Math.max(0, line.bbox.y0);

    const width =
      Math.min(
        canvas.width - x,
        line.bbox.x1 - line.bbox.x0
      );

    const height =
      Math.min(
        canvas.height - y,
        line.bbox.y1 - line.bbox.y0
      );


    if (width <= 0 || height <= 0) {
      continue;
    }


    /*
       IMPORTANT :
       On ne prend que la partie gauche
       de la ligne.

       Le numéro 212XXXXXXXXX se trouve
       dans la première colonne.

       La partie 604XXXXXXXXXXXXX est donc
       volontairement ignorée.
    */

    const leftWidth =
      Math.floor(width * 0.58);


    const lineCanvas = cropCanvas(
      canvas,
      x,
      y,
      leftWidth,
      height
    );


    /*
       OCR de cette seule partie.
    */

    const text =
      await readLine(worker, lineCanvas);


    const number =
      findPhoneNumber(text);


    if (number) {

      numbers.push(number);

    } else {

      /*
         On ne met dans "À vérifier" que
         les lignes qui contiennent réellement
         des chiffres mais dont le numéro
         212XXXXXXXXX n'a pas pu être identifié.
      */

      const digits =
        cleanOCR(text).replace(/\D/g, "");

      if (digits.length >= 8) {

        warnings.push({
          line: i + 1,
          text: text
        });

      }

    }


    const globalProgress =
      (
        ((photoNumber - 1) / totalPhotos) * 100
      ) +
      (
        (1 / totalPhotos) *
        ((i + 1) / lines.length) *
        100
      );

    progress.value =
      Math.min(100, globalProgress);

  }


  return {
    numbers,
    warnings
  };

}


/* --------------------------------------------------
   Traitement principal
-------------------------------------------------- */

processButton.addEventListener(
  "click",
  async function() {

    if (!selectedFiles.length) {

      alert(
        "Veuillez choisir une ou plusieurs photos."
      );

      return;

    }


    processButton.disabled = true;

    results.hidden = true;

    warningsElement.innerHTML = "";

    duplicatesElement.innerHTML = "";

    totalElement.textContent = "0";

    uniqueElement.textContent = "0";

    duplicateCountElement.textContent = "0";


    progress.hidden = false;

    progress.value = 0;


    status.textContent =
      "Préparation de la reconnaissance...";


    try {

      /*
         Création du moteur OCR
      */

      const worker =
        await Tesseract.createWorker(
          "eng",
          1,
          {
            logger: message => {

              if (
                message.status ===
                "recognizing text"
              ) {

                const percent =
                  Math.round(
                    (message.progress || 0) * 100
                  );

                status.textContent =
                  "Reconnaissance OCR : " +
                  percent +
                  "%";

              }

            }
          }
        );


      /*
         Configuration OCR
      */

      await worker.setParameters({

        tessedit_char_whitelist:
          "0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz",

        preserve_interword_spaces:
          "1"

      });


      const allNumbers = [];

      const allWarnings = [];


      /*
         Traitement de toutes les photos
      */

      for (
        let i = 0;
        i < selectedFiles.length;
        i++
      ) {

        status.textContent =
          "Traitement de la photo " +
          (i + 1) +
          " / " +
          selectedFiles.length;


        const result =
          await processPhoto(
            worker,
            selectedFiles[i],
            i + 1,
            selectedFiles.length
          );


        allNumbers.push(
          ...result.numbers
        );


        result.warnings.forEach(w => {

          allWarnings.push({
            photo: i + 1,
            line: w.line,
            text: w.text
          });

        });

      }


      await worker.terminate();


      /*
         Comptage
      */

      const counts = new Map();


      allNumbers.forEach(number => {

        counts.set(
          number,
          (counts.get(number) || 0) + 1
        );

      });


      const duplicates = [];


      counts.forEach((count, number) => {

        if (count > 1) {

          duplicates.push({
            number: number,
            count: count
          });

        }

      });


      /*
         Affichage
      */

      totalElement.textContent =
        allNumbers.length;

      uniqueElement.textContent =
        counts.size;

      duplicateCountElement.textContent =
        duplicates.length;


      if (!duplicates.length) {

        duplicatesElement.innerHTML =
          "<span>✅ Aucun doublon trouvé.</span>";

      } else {

        duplicates.sort(
          (a, b) => b.count - a.count
        );


        duplicates.forEach(item => {

          const div =
            document.createElement("div");

          div.className =
            "number duplicate";

          div.textContent =
            item.number +
            "  →  " +
            item.count +
            " fois";

          duplicatesElement.appendChild(div);

        });

      }


      /*
         Affichage des lignes réellement
         impossibles à lire
      */

      if (allWarnings.length) {

        const title =
          document.createElement("div");

        title.className = "warning";

        title.innerHTML =
          "<strong>⚠️ À vérifier :</strong><br>" +
          allWarnings.length +
          " ligne(s) n'ont pas pu être reconnue(s) comme un numéro 212XXXXXXXXX.";

        warningsElement.appendChild(title);


        allWarnings.forEach(item => {

          const div =
            document.createElement("div");

          div.className =
            "warning";

          div.innerHTML =
            "Photo " +
            item.photo +
            ", ligne " +
            item.line +
            "<br>OCR : " +
            (item.text || "(vide)");

          warningsElement.appendChild(div);

        });

      }


      results.hidden = false;

      progress.value = 100;

      status.textContent =
        "✅ Vérification terminée.";


    } catch (error) {

      console.error(error);

      status.textContent =
        "❌ Une erreur est survenue.";

      alert(
        "Erreur pendant la reconnaissance OCR."
      );

    }


    processButton.disabled = false;

  });

</script>

</body>
</html>
