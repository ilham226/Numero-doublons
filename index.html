<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Numéros doublons</title>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

<style>
body {
    font-family: Arial, sans-serif;
    margin: 0;
    padding: 20px;
    background: #f5f5f5;
    color: #222;
}

.container {
    max-width: 700px;
    margin: auto;
}

h1 {
    text-align: center;
}

.card {
    background: white;
    padding: 18px;
    border-radius: 14px;
    margin-top: 15px;
}

input[type="file"] {
    display: none;
}

.chooseButton {
    display: block;
    width: 100%;
    box-sizing: border-box;
    padding: 16px;
    margin: 8px 0;
    border-radius: 12px;
    text-align: center;
    color: white;
    font-size: 17px;
    font-weight: bold;
    cursor: pointer;
}

.library {
    background: #34a853;
}

.camera {
    background: #ff9500;
}

#analyze {
    width: 100%;
    padding: 16px;
    margin-top: 12px;
    border: 0;
    border-radius: 12px;
    background: #007aff;
    color: white;
    font-size: 17px;
    font-weight: bold;
}

#analyze:disabled {
    background: #999;
}

#progress {
    text-align: center;
    font-weight: bold;
    margin-top: 15px;
}

#photosInfo {
    margin-top: 12px;
    text-align: center;
    font-size: 15px;
}

.number {
    font-family: monospace;
    font-size: 17px;
    padding: 7px 0;
}

.duplicate {
    color: #d00000;
    font-weight: bold;
}

.warning {
    color: #a05a00;
    padding: 6px 0;
    word-break: break-word;
}
</style>
</head>

<body>

<div class="container">

<h1>📱 Numéros doublons</h1>

<div class="card">

    <h3>Ajouter les photos</h3>

    <!-- ============================= -->
    <!-- BOUTON BIBLIOTHÈQUE PHOTOS -->
    <!-- ============================= -->

    <label class="chooseButton library">

        🖼️ Choisir dans la bibliothèque

        <input
            id="libraryInput"
            type="file"
            accept="image/*"
            multiple
        >

    </label>


    <!-- ============================= -->
    <!-- BOUTON CAMÉRA -->
    <!-- ============================= -->

    <label class="chooseButton camera">

        📷 Prendre une photo avec la caméra

        <input
            id="cameraInput"
            type="file"
            accept="image/*"
            capture="environment"
        >

    </label>


    <div id="photosInfo">
        Aucune photo sélectionnée.
    </div>


    <button id="analyze">
        🔍 Lire les numéros
    </button>


    <div id="progress"></div>

</div>


<div id="summary"></div>

<div id="duplicates"></div>

<div id="verify"></div>


<script>

// ========================================================
// VARIABLES
// ========================================================

let selectedFiles = [];

const libraryInput =
    document.getElementById("libraryInput");

const cameraInput =
    document.getElementById("cameraInput");

const analyzeButton =
    document.getElementById("analyze");

const photosInfo =
    document.getElementById("photosInfo");

const progress =
    document.getElementById("progress");


// ========================================================
// BIBLIOTHÈQUE
// ========================================================

libraryInput.addEventListener("change", function() {

    const files =
        Array.from(this.files);

    if (files.length > 0) {

        selectedFiles.push(...files);

        updatePhotosInfo();
    }

    // Permet de choisir à nouveau les mêmes photos
    this.value = "";
});


// ========================================================
// CAMÉRA
// ========================================================

cameraInput.addEventListener("change", function() {

    const files =
        Array.from(this.files);

    if (files.length > 0) {

        selectedFiles.push(...files);

        updatePhotosInfo();
    }

    this.value = "";
});


// ========================================================
// AFFICHER LE NOMBRE DE PHOTOS
// ========================================================

function updatePhotosInfo() {

    if (selectedFiles.length === 0) {

        photosInfo.textContent =
            "Aucune photo sélectionnée.";

        return;
    }

    photosInfo.textContent =
        "📸 " +
        selectedFiles.length +
        " photo(s) sélectionnée(s).";
}


// ========================================================
// CHARGER UNE IMAGE
// ========================================================

function loadImage(file) {

    return new Promise((resolve, reject) => {

        const img = new Image();

        img.onload = function() {
            resolve(img);
        };

        img.onerror = function() {
            reject(new Error("Impossible de charger l'image"));
        };

        img.src =
            URL.createObjectURL(file);
    });
}


// ========================================================
// PRÉPARER L'IMAGE
// ========================================================

function preprocessImage(img) {

    const canvas =
        document.createElement("canvas");

    const maxWidth = 2500;

    let width =
        img.naturalWidth;

    let height =
        img.naturalHeight;


    if (width > maxWidth) {

        const ratio =
            maxWidth / width;

        width =
            maxWidth;

        height =
            Math.round(
                height * ratio
            );
    }


    canvas.width = width;
    canvas.height = height;


    const ctx =
        canvas.getContext("2d");

    ctx.drawImage(
        img,
        0,
        0,
        width,
        height
    );


    const imageData =
        ctx.getImageData(
            0,
            0,
            width,
            height
        );


    const data =
        imageData.data;


    // Amélioration du contraste
    for (
        let i = 0;
        i < data.length;
        i += 4
    ) {

        const r = data[i];
        const g = data[i + 1];
        const b = data[i + 2];


        let gray =
            0.299 * r +
            0.587 * g +
            0.114 * b;


        gray =
            (gray - 128) * 1.5 + 128;


        gray =
            Math.max(
                0,
                Math.min(
                    255,
                    gray
                )
            );


        data[i] =
            gray;

        data[i + 1] =
            gray;

        data[i + 2] =
            gray;
    }


    ctx.putImageData(
        imageData,
        0,
        0
    );


    return canvas;
}


// ========================================================
// EXTRAIRE UN NUMÉRO 212XXXXXXXXX
// ========================================================

function extractPhone(text) {

    if (!text) {
        return null;
    }


    let s =
        text
        .replace(/\s/g, "")
        .replace(/[|Il]/g, "1")
        .replace(/[OoQ]/g, "0");


    // Recherche de 212 + 9 chiffres
    const match =
        s.match(/212\d{9}/);


    if (match) {

        return match[0];
    }


    return null;
}


// ========================================================
// DÉTECTER LES LIGNES
// ========================================================

async function detectLines(
    worker,
    canvas
) {

    const result =
        await worker.recognize(
            canvas
        );


    return (
        result.data.lines || []
    );
}


// ========================================================
// LIRE UNE LIGNE
// ========================================================

async function readLine(
    worker,
    canvas,
    line
) {

    const x =
        Math.max(
            0,
            Math.floor(
                line.bbox.x0
            )
        );


    const y =
        Math.max(
            0,
            Math.floor(
                line.bbox.y0
            )
        );


    const width =
        Math.min(
            canvas.width - x,
            Math.ceil(
                line.bbox.x1 -
                line.bbox.x0
            )
        );


    const height =
        Math.min(
            canvas.height - y,
            Math.ceil(
                line.bbox.y1 -
                line.bbox.y0
            )
        );


    if (
        width <= 0 ||
        height <= 0
    ) {
        return "";
    }


    // On ne prend que la partie gauche.
    // Le numéro 212... est dans la première colonne.

    const cropWidth =
        Math.min(
            width,
            Math.floor(
                canvas.width * 0.55
            )
        );


    const crop =
        document.createElement(
            "canvas"
        );


    crop.width =
        cropWidth;

    crop.height =
        height;


    const ctx =
        crop.getContext("2d");


    ctx.drawImage(
        canvas,
        x,
        y,
        cropWidth,
        height,
        0,
        0,
        cropWidth,
        height
    );


    const result =
        await worker.recognize(
            crop
        );


    return (
        result.data.text || ""
    );
}


// ========================================================
// ANALYSER LES PHOTOS
// ========================================================

analyzeButton.addEventListener(
    "click",
    async function() {

        if (
            selectedFiles.length === 0
        ) {

            alert(
                "Choisis ou prends au moins une photo."
            );

            return;
        }


        analyzeButton.disabled =
            true;


        let allNumbers = [];

        let allWarnings = [];

        let totalLines = 0;


        progress.textContent =
            "⏳ Préparation de l'OCR...";


        const worker =
            await Tesseract.createWorker(
                "eng"
            );


        await worker.setParameters({

            tessedit_char_whitelist:
                "0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz-|"
        });


        try {

            // =========================================
            // CHAQUE PHOTO
            // =========================================

            for (
                let photoIndex = 0;
                photoIndex <
                selectedFiles.length;
                photoIndex++
            ) {

                const file =
                    selectedFiles[
                        photoIndex
                    ];


                progress.textContent =
                    "📷 Photo " +
                    (photoIndex + 1) +
                    "/" +
                    selectedFiles.length +
                    " : préparation...";


                const img =
                    await loadImage(
                        file
                    );


                const canvas =
                    preprocessImage(
                        img
                    );


                // =====================================
                // DÉTECTION DES LIGNES
                // =====================================

                progress.textContent =
                    "🔎 Photo " +
                    (photoIndex + 1) +
                    "/" +
                    selectedFiles.length +
                    " : recherche des lignes...";


                const lines =
                    await detectLines(
                        worker,
                        canvas
                    );


                totalLines +=
                    lines.length;


                if (
                    lines.length === 0
                ) {

                    allWarnings.push(
                        "Photo " +
                        (photoIndex + 1) +
                        " : aucune ligne détectée."
                    );

                    continue;
                }


                // =====================================
                // LECTURE LIGNE PAR LIGNE
                // =====================================

                for (
                    let i = 0;
                    i < lines.length;
                    i++
                ) {

                    progress.textContent =
                        "📖 Photo " +
                        (photoIndex + 1) +
                        "/" +
                        selectedFiles.length +
                        " — ligne " +
                        (i + 1) +
                        "/" +
                        lines.length;


                    const text =
                        await readLine(
                            worker,
                            canvas,
                            lines[i]
                        );


                    const phone =
                        extractPhone(
                            text
                        );


                    if (phone) {

                        allNumbers.push({

                            number:
                                phone,

                            photo:
                                photoIndex + 1,

                            line:
                                i + 1
                        });

                    } else {

                        allWarnings.push({

                            photo:
                                photoIndex + 1,

                            line:
                                i + 1,

                            text:
                                text ||
                                "(aucun texte reconnu)"
                        });
                    }
                }
            }


        } catch (error) {

            console.error(error);

            alert(
                "Une erreur est survenue pendant la lecture."
            );


        } finally {

            await worker.terminate();


            progress.textContent =
                "✅ Analyse terminée.";


            displayResults(
                totalLines,
                allNumbers,
                allWarnings
            );


            analyzeButton.disabled =
                false;
        }
    }
);


// ========================================================
// AFFICHER LES RÉSULTATS
// ========================================================

function displayResults(
    totalLines,
    allNumbers,
    allWarnings
) {

    const summary =
        document.getElementById(
            "summary"
        );


    const duplicatesDiv =
        document.getElementById(
            "duplicates"
        );


    const verifyDiv =
        document.getElementById(
            "verify"
        );


    // =====================================
    // COMPTAGE
    // =====================================

    const counts = {};


    allNumbers.forEach(
        item => {

            if (
                !counts[item.number]
            ) {

                counts[item.number] =
                    [];
            }


            counts[item.number]
                .push(item);
        }
    );


    const duplicates =
        Object.entries(
            counts
        ).filter(
            ([number, items]) =>
                items.length > 1
        );


    // =====================================
    // RÉSUMÉ
    // =====================================

    summary.innerHTML = `

        <div class="card">

            <h2>📊 Résultat</h2>

            <p>
                <b>Photos :</b>
                ${selectedFiles.length}
            </p>

            <p>
                <b>Lignes détectées :</b>
                ${totalLines}
            </p>

            <p>
                <b>Numéros reconnus :</b>
                ${allNumbers.length}
            </p>

            <p>
                <b>À vérifier :</b>
                ${allWarnings.length}
            </p>

            <p>
                <b>Numéros différents :</b>
                ${Object.keys(counts).length}
            </p>

            <p>
                <b>Numéros en double :</b>
                ${duplicates.length}
            </p>

        </div>
    `;


    // =====================================
    // DOUBLONS
    // =====================================

    if (
        duplicates.length > 0
    ) {

        let html = `

            <div class="card">

                <h2>
                    🔴 Numéros qui se répètent
                </h2>
        `;


        duplicates.forEach(
            ([number, items]) => {

                html += `

                    <div
                        class="number duplicate"
                    >

                        ${number}

                        — ${items.length}
                        fois

                    </div>
                `;
            }
        );


        html += `

                <button
                    id="copyButton"
                    style="
                        width:100%;
                        padding:14px;
                        margin-top:10px;
                        border:0;
                        border-radius:10px;
                        background:#007aff;
                        color:white;
                        font-size:16px;
                        font-weight:bold;
                    "
                >
                    📋 Copier les doublons
                </button>

            </div>
        `;


        duplicatesDiv.innerHTML =
            html;


        document
            .getElementById(
                "copyButton"
            )
            .addEventListener(
                "click",
                function() {

                    const numbers =
                        duplicates.map(
                            ([number]) =>
                                number
                        );


                    navigator
                        .clipboard
                        .writeText(
                            numbers.join(
                                "\n"
                            )
                        );


                    alert(
                        numbers.length +
                        " doublon(s) copié(s)."
                    );
                }
            );


    } else {

        duplicatesDiv.innerHTML = `

            <div class="card">

                <h2>
                    🟢 Aucun doublon
                </h2>

            </div>
        `;
    }


    // =====================================
    // À VÉRIFIER
    // =====================================

    if (
        allWarnings.length > 0
    ) {

        let html = `

            <div class="card">

                <h2>
                    ⚠️ À vérifier
                </h2>

                <p>
                    Ces lignes n'ont pas permis
                    de reconnaître clairement
                    un numéro 212...
                </p>
        `;


        allWarnings.forEach(
            item => {

                if (
                    typeof item ===
                    "string"
                ) {

                    html += `

                        <div class="warning">
                            ${item}
                        </div>
                    `;

                } else {

                    html += `

                        <div class="warning">

                            Photo ${item.photo},
                            ligne ${item.line}

                            — OCR :

                            <b>
                                ${escapeHtml(
                                    item.text
                                )}
                            </b>

                        </div>
                    `;
                }
            }
        );


        html += `
            </div>
        `;


        verifyDiv.innerHTML =
            html;


    } else {

        verifyDiv.innerHTML = `

            <div class="card">

                <h2>
                    ✅ Toutes les lignes
                    ont été reconnues
                </h2>

            </div>
        `;
    }
}


// ========================================================
// PROTECTION HTML
// ========================================================

function escapeHtml(text) {

    return String(text)
        .replace(
            /&/g,
            "&amp;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        )
        .replace(
            /"/g,
            "&quot;"
        )
        .replace(
            /'/g,
            "&#039;"
        );
}

</script>

</body>
</html>
